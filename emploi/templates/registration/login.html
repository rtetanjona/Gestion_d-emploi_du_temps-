{% extends "base.html" %}
{% block content %}
<div class="flex justify-center items-center mt-10">
    <div class="card w-full max-w-sm bg-base-200 shadow-xl">
        <div class="card-body">
            <h1 class="text-2xl font-bold text-center mb-4">Connexion</h1>

            {% if form.non_field_errors %}
            <div class="alert alert-error mb-2">
                {% for erreur in form.non_field_errors %}
                <span>{{ erreur }}</span>
                {% endfor %}
            </div>
            {% endif %}

            <form method="POST" class="flex flex-col gap-3">
                {% csrf_token %}

                <div class="form-control">
                    <label class="label"><span class="label-text">Nom d'utilisateur</span></label>
                    <input type="text" name="username" class="input input-bordered w-full" required autofocus />
                </div>

                <div class="form-control">
                    <label class="label"><span class="label-text">Mot de passe</span></label>
                    <input type="password" name="password" class="input input-bordered w-full" required />
                </div>

                <input type="hidden" name="next" value="{{ next }}" />

                <button type="submit" class="btn btn-accent w-full mt-4">Se connecter</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
